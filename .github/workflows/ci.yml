# CVER OSS shared delivery baseline — Node CI (dim 7).
# Source template: ~/cver-oss-baseline/workflows/node-ci.yml
#
# CI runs the deterministic gate (the pure + unit decision-logic suites plus the
# shared release-readiness check) and the integration suite (test:auto), which
# drives the runner's preinstalled Google Chrome over CDP and exercises the
# createBleedblendAuto() state machine against both the ESM source and the
# CommonJS mirror. Pushing a vX.Y.Z tag also runs the release-tag ⇄ version check.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Test (deterministic decision-logic suites)
        run: npm run test:ci

      - name: Test (integration, real Chrome over CDP)
        run: npm run test:auto

      - name: Release readiness
        run: node scripts/check-release-readiness.mjs
